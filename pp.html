<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 生日快乐！🎉</title>

    <!-- Plyr 播放器样式 -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== 生日卡片 ==================== -->
    <div class="birthday-card">
        <div class="ribbon-badge">🎀 生日快乐 🎀</div>
        <h1 id="main-title">🎉 生日快乐！🎉</h1>

        <div class="photo-wrapper">
            <img
            src="https://via.placeholder.com/200x200?text=%F0%9F%93%B7"
            alt="生日照片"
            id="birthday-photo"
            >
        </div>

        <div id="countdown"></div>

        <div id="audio-container">
            <audio id="audio-player" controls playsinline></audio>
        </div>

        <button onclick="toggleMessage()" id="blessing-btn">💝 显示祝福</button>
    </div>

    <!-- Plyr 播放器库 -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js">
    </script>

    <!-- 自定义脚本 -->
    <script src="script.js">
    </script>
</body>
</html>
